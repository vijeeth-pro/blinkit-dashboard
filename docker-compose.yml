version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: blinkit_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: blinkit_db
    ports:
      - "5433:5432" # Exposed on Host Port 5433 to avoid collision with running Postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d blinkit_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: blinkit_backend
    restart: always
    ports:
      - "5002:5002" # Exposed on Host Port 5002 to avoid collision with Port 5001
    environment:
      PORT: 5002
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/blinkit_db
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    container_name: blinkit_frontend
    restart: always
    ports:
      - "8080:80" # Exposed on Host Port 8080 to avoid collision with Port 80
    depends_on:
      - backend

volumes:
  postgres_data:
